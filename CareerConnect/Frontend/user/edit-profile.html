<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
<div class="app-layout"><aside class="sidebar"><a class="logo" href="dashboard.html"><span class="logo-mark">CC</span><span>CareerConnect</span></a>
<div class="sidebar-title">User Panel</div>
<a class="" href="dashboard.html">Dashboard</a><a class="active" href="profile.html">Profile</a><a class="" href="jobs.html">Find Jobs</a><a class="" href="applications.html">Applications</a><a class="" href="saved-jobs.html">Saved Jobs</a><a class="" href="network.html">Network</a><a class="" href="notifications.html">Notifications</a>
<a href="../auth/login.html" style="margin-top:18px;">Logout</a></aside><main class="dashboard-main"><div class="page-header"><h1>Edit Profile</h1><p>CareerConnect user panel</p></div><div class="card"><form id="editProfileForm"><div class="grid-2">
<div class="form-group"><label>Full Name</label><input class="form-control" id="fullName" value="Pradip Kumar"></div>
<div class="form-group"><label>Headline</label><input class="form-control" id="headline" value="MCA Student • Software Developer"></div></div>
<div class="form-group"><label>About</label><textarea class="form-control" id="about">Motivated MCA student interested in software development.</textarea></div>
<div class="grid-2"><div class="form-group"><label>Education</label><input class="form-control" id="education" value="MCA - SPPU"></div><div class="form-group"><label>Location</label><input class="form-control" id="location" value="Pune, Maharashtra"></div></div>
<div class="form-group"><label>Skills</label><input class="form-control" id="skills" placeholder="HTML, CSS, JavaScript, Java"></div>
<div class="form-group"><label>Resume (PDF)</label><input class="form-control" id="resume" type="file" accept=".pdf"></div>
<button class="btn btn-primary" type="submit">Save Changes</button> <a class="btn btn-muted" href="profile.html">Cancel</a></form></div></main></div>
</body>
</html>
